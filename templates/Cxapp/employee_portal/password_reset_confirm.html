{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password · Employee Portal</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,sans-serif;background:#f0f4f8;display:flex;align-items:center;
      justify-content:center;min-height:100vh}
    .card{background:#fff;padding:40px;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.08);width:360px}
    h2{color:#0f2027;margin-bottom:6px}
    p.sub{color:#6b7c93;font-size:13px;margin-bottom:22px}
    .msg{background:#eafaf3;border-left:4px solid #2a9d8f;border-radius:6px;padding:10px 14px;
      margin-bottom:18px;font-size:13px;color:#155c4b}
    .err{background:#fdecea;border-left:4px solid #e63946;border-radius:6px;padding:10px 14px;
      margin-bottom:18px;font-size:13px;color:#7d2027}
    .fg{display:flex;flex-direction:column;gap:5px;margin-bottom:18px}
    .fg label{font-size:11.5px;font-weight:600;color:#6b7c93;text-transform:uppercase}
    .fg input{font-size:15px;padding:11px 14px;border:1.5px solid #dde5ed;border-radius:8px;outline:none}
    .fg input:focus{border-color:#2a9d8f}
    button{width:100%;padding:13px;background:linear-gradient(135deg,#0f2027,#2a9d8f);color:#fff;
      border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
  </style>
</head>
<body>
  <div class="card">
    <h2>Set new password</h2>
    <p class="sub">Choose a new password for your account.</p>
    {% if messages %}
      {% for message in messages %}
        <div class="{% if message.tags == 'success' %}msg{% else %}err{% endif %}">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% if validlink %}
    <form method="post">
      {% csrf_token %}
      <div class="fg"><label>New Password</label><input type="password" name="password1" required autofocus></div>
      <div class="fg"><label>Confirm Password</label><input type="password" name="password2" required></div>
      <button type="submit">Update Password</button>
    </form>
    {% endif %}
  </div>
</body>
</html>
