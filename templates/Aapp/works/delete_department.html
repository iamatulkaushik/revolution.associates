{% extends 'default.html' %}
{% block title %}Delete Department{% endblock %}
{% block content %}
<h2>Delete Department</h2>

<p>Are you sure you want to delete the department <strong>{{ department.department_name }}</strong> from branch <strong>{{ department.branch.branch_name }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="button">Confirm Delete</button>
    <a href="{% url 'department_list' %}" class="button">Cancel</a>
</form>
{% endblock %}
