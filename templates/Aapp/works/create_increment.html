{% extends 'Aapp/base.html' %}
{% block title %}Add Increment{% endblock %}
{% block content %}
<div class="main-content">
<h2>Add Increment — {{ company.company_name }}</h2>

{% if messages %}
{% for message in messages %}
<div class="{% if message.tags == 'error' %}error{% else %}success{% endif %}">{{ message }}</div>
{% endfor %}
{% endif %}

<form method="post" id="increment-form">
    {% csrf_token %}
    <table class="data-table">
        {{ form.as_table }}
        <tr>
            <td colspan="2">
                <button type="submit" class="button">Save Increment</button>
                <a href="{% url 'list_increments' %}" class="button">Cancel</a>
            </td>
        </tr>
    </table>
</form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const empSelect = document.getElementById('id_employee');
    const oldBasic = document.getElementById('id_old_basicpay');
    const oldHra = document.getElementById('id_old_hra');
    if (!empSelect) return;

    empSelect.addEventListener('change', function () {
        const empId = this.value;
        if (!empId) return;
        fetch(`{% url 'get_employee_pay_scale' 0 %}`.replace('0', empId))
            .then(r => r.json())
            .then(data => {
                oldBasic.value = data.old_basicpay;
                oldHra.value = data.old_hra;
            })
            .catch(() => {});
    });

    // Pre-fill on load if an employee is already selected (edit/re-render after error)
    if (empSelect.value) empSelect.dispatchEvent(new Event('change'));
});
</script>
{% endblock %}
