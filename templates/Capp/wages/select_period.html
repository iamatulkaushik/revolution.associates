{% extends 'Capp/base.html' %}
{% block title %}{{ action_label }}{% endblock %}
{% block content %}
<div class="section-header"><h2>{{ action_label }}</h2></div>
<div class="card" style="max-width:400px">
  <div class="card-header"><h3>Select Month & Year</h3></div>
  <div class="card-body">
    <form method="get" action="{% url action_name %}" novalidate>
      <div class="form-grid">
        <div class="form-group">
          <label for="month">Month</label>
          <select id="month" name="month">
            {% for n,lbl in months %}
            <option value="{{ n }}">{{ lbl }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label for="year">Year</label>
          <input type="number" id="year" name="year" value="2026" min="2020" max="2050">
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="button btn-primary">{{ action_label }}</button>
        <a href="{% url 'capp_dashboard' %}" class="button">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
