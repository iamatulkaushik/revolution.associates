{% extends 'Aapp/base.html' %}
{% block title %}Assign Asset{% endblock %}
{% block content %}
<div class="main-content">
<h2>Assign Asset — {{ asset.asset_name }}</h2>
{% if messages %}{% for message in messages %}<div class="{% if message.tags == 'error' %}error{% else %}success{% endif %}">{{ message }}</div>{% endfor %}{% endif %}
<form method="post">
    {% csrf_token %}
    <table class="data-table">{{ form.as_table }}
        <tr><td colspan="2">
            <button type="submit" class="button">Assign</button>
            <a href="{% url 'list_assets' %}" class="button">Cancel</a>
        </td></tr>
    </table>
</form>
</div>
{% endblock %}
