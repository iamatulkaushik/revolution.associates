{% extends 'Capp/base.html' %}
{% block title %}Delete{% endblock %}
{% block content %}
<div class="section-header"><h2>Delete</h2></div>
<div class="card"><div class="card-body">
  <p>Delete {{ label }}? This cannot be undone.</p>
  <form method="post">{% csrf_token %}
    <button type="submit" class="button">Yes, delete</button>
    <a href="{% url cancel_url %}" class="button">Cancel</a>
  </form>
</div></div>
{% endblock %}
