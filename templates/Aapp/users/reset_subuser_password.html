{% extends 'Aapp/base.html' %}
{% block title %}Reset Password{% endblock %}
{% load static %}
{% block content %}
<div class="main-content">
    <div class="container">
        {% if messages %}
            {% for message in messages %}
            <div class="message-alert {% if message.tags == 'success' %}message-success{% else %}message-error{% endif %}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <div class="quickupdate" style="max-width:480px;">
            <h2>Reset Password — {{ subuser.user.username }}</h2><hr>
            <form method="post">
                {% csrf_token %}
                <table class="data-table" style="background:transparent; box-shadow:none; min-width:unset;">
                    <tbody>
                        <tr>
                            <td><label>New Password <span style="color:var(--Color1)">*</span></label></td>
                            <td><input type="password" name="new_password" required></td>
                        </tr>
                        <tr>
                            <td><label>Confirm Password <span style="color:var(--Color1)">*</span></label></td>
                            <td><input type="password" name="confirm_password" required></td>
                        </tr>
                    </tbody>
                </table>
                <br>
                <button type="submit" class="button">Reset Password</button>
                <a href="{% url 'list_subusers' %}" class="button" style="margin-left:10px;">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
