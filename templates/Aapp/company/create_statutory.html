{% extends 'Aapp/base.html' %}
{% block title %}Create Company Statutory{% endblock %}
{% block content %}
<div class="main-content">
<h2>Create Company Statutory Details</h2>

{% if messages %}
{% for message in messages %}
<div class="{% if message.tags == 'error' %}error{% else %}success{% endif %}">{{ message }}</div>
{% endfor %}
{% endif %}

<p><strong>Company:</strong> <span id="company-name">Loading...</span></p>

<form method="post">
    {% csrf_token %}
    <table class="data-table">
        <tr>
            <td><label for="shop_act">Shop Act Number:</label></td>
            <td><input type="text" id="shop_act" name="shop_act" maxlength="15"></td>
            <td><label for="shop_act_date">Shop Act Date:</label></td>
            <td><input type="date" id="shop_act_date" name="shop_act_date"></td>
        </tr>
        <tr>
            <td><label for="gst">GST Number:</label></td>
            <td><input type="text" id="gst" name="gst" maxlength="15"></td>
            <td><label for="gst_date">GST Date:</label></td>
            <td><input type="date" id="gst_date" name="gst_date"></td>
        </tr>
        <tr>
            <td><label for="epfo">EPFO Number:</label></td>
            <td><input type="text" id="epfo" name="epfo" maxlength="15"></td>
            <td><label for="epfo_date">EPFO Date:</label></td>
            <td><input type="date" id="epfo_date" name="epfo_date"></td>
        </tr>
        <tr>
            <td><label for="esic">ESIC Number:</label></td>
            <td><input type="text" id="esic" name="esic" maxlength="15"></td>
            <td><label for="esic_date">ESIC Date:</label></td>
            <td><input type="date" id="esic_date" name="esic_date"></td>
        </tr>
        <tr>
            <td><label for="labour">Labour License:</label></td>
            <td><input type="text" id="labour" name="labour" maxlength="15"></td>
            <td><label for="labour_from">From:</label></td>
            <td><input type="date" id="labour_from" name="labour_from"></td>
            <td><label for="labour_to">To:</label></td>
            <td><input type="date" id="labour_to" name="labour_to"></td>
        </tr>
        <tr>
            <td><label for="psara">PSARA License:</label></td>
            <td><input type="text" id="psara" name="psara" maxlength="15"></td>
            <td><label for="psara_from">From:</label></td>
            <td><input type="date" id="psara_from" name="psara_from"></td>
            <td><label for="psara_to">To:</label></td>
            <td><input type="date" id="psara_to" name="psara_to"></td>
        </tr>
        <tr>
            <td><label for="pt_number">Professional Tax No.:</label></td>
            <td><input type="text" id="pt_number" name="pt_number" maxlength="15"></td>
            <td><label for="pt_date">Registration Date:</label></td>
            <td><input type="date" id="pt_date" name="pt_date"></td>
        </tr>
        <tr>
            <td colspan="2">
                <button type="submit" class="button">Create Statutory</button>
                <a href="{% url 'list_company_associate' %}" class="button">Cancel</a>
            </td>
        </tr>
    </table>
</form></div>

<script>
function checkSelectedCompany() {
    fetch('{% url "get_selected_company" %}')
        .then(response => response.json())
        .then(data => {
            if (!data.company_id) {
                alert('Please select a company first.');
                window.location.href = '{% url 'aapp_dashboard' %}';
            } else {
                document.getElementById('company-name').textContent = data.company_name;
            }
        });
}
document.addEventListener('DOMContentLoaded', checkSelectedCompany);
</script>
{% endblock %}
