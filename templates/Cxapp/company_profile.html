{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Company Profile · {{ company.company_name }}</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--navy:#0f2027;--green:#2a9d8f;--cream:#f0f4f8;--gold:#e9c46a}
    body{font-family:'Ubuntu',system-ui,sans-serif;background:var(--cream);color:var(--navy)}
    .topbar{background:var(--navy);color:#fff;padding:16px 32px;display:flex;justify-content:space-between}
    .topbar a{color:#fff;text-decoration:none;font-size:13px;opacity:.8}
    .wrap{max-width:640px;margin:0 auto;padding:32px 24px}
    .card{background:#fff;border-radius:12px;padding:28px;box-shadow:0 4px 20px rgba(15,32,39,.06)}
    .fg{margin-bottom:14px}
    .fg label{display:block;font-size:11.5px;font-weight:600;color:#6b7c93;text-transform:uppercase;margin-bottom:4px}
    .fg input{width:100%;font-size:14px;padding:9px 12px;border:1.5px solid #dde5ed;border-radius:7px;background:var(--cream)}
    .fg input[disabled]{background:#f4f0e2;color:#8a7a3d}
    .locked-tag{font-size:10px;color:#a67c00;margin-left:6px}
    .btn{padding:11px 20px;background:linear-gradient(135deg,#0f2027,#2a9d8f);color:#fff;border:none;
      border-radius:8px;font-weight:600;cursor:pointer}
  </style>
</head>
<body>
  <div class="topbar">
    <strong>{{ company.company_name }}</strong>
    <a href="{% url 'cxapp_dashboard' %}">← Dashboard</a>
  </div>
  <div class="wrap">
    <div class="card">
      <form method="post">
        {% csrf_token %}
        <div class="fg"><label>Company Name <span class="locked-tag">🔒 locked</span></label>
          <input type="text" value="{{ company.company_name }}" disabled></div>
        <div class="fg"><label>PAN <span class="locked-tag">🔒 locked</span></label>
          <input type="text" value="{{ company.pan }}" disabled></div>
        <div class="fg"><label>Email <span class="locked-tag">🔒 locked</span></label>
          <input type="text" value="{{ company.email1 }}" disabled></div>
        <div class="fg"><label>Mobile <span class="locked-tag">🔒 locked</span></label>
          <input type="text" value="{{ company.mobile }}" disabled></div>

        <div class="fg"><label>Tagline</label>
          <input type="text" name="tagline1" value="{{ company.tagline1|default:'' }}"></div>
        <div class="fg"><label>Address Line 1</label>
          <input type="text" name="address1" value="{{ company.address1|default:'' }}"></div>
        <div class="fg"><label>PIN Code</label>
          <input type="text" name="pin" value="{{ company.pin|default:'' }}"></div>
        <div class="fg"><label>Website</label>
          <input type="text" name="website" value="{{ company.website|default:'' }}"></div>

        {% if cx_is_owner %}<button type="submit" class="btn">Save Changes</button>{% endif %}
      </form>
    </div>
  </div>
</body>
</html>
