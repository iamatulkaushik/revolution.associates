{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Sub User</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--navy:#0f2027;--green:#2a9d8f;--cream:#f0f4f8}
    body{font-family:'Ubuntu',system-ui,sans-serif;background:var(--cream);color:var(--navy)}
    .topbar{background:var(--navy);color:#fff;padding:16px 32px;display:flex;justify-content:space-between}
    .topbar a{color:#fff;text-decoration:none;font-size:13px;opacity:.8}
    .wrap{max-width:480px;margin:0 auto;padding:32px 24px}
    .card{background:#fff;border-radius:12px;padding:28px;box-shadow:0 4px 20px rgba(15,32,39,.06)}
    .fg{margin-bottom:16px}
    .fg label{display:block;font-size:11.5px;font-weight:600;color:#6b7c93;text-transform:uppercase;margin-bottom:4px}
    .fg input,.fg select{width:100%;font-size:14px;padding:10px 12px;border:1.5px solid #dde5ed;
      border-radius:7px;background:var(--cream)}
    .btn{width:100%;padding:12px;background:linear-gradient(135deg,#0f2027,#2a9d8f);color:#fff;border:none;
      border-radius:8px;font-weight:600;cursor:pointer}
    .field-err{font-size:11.5px;color:#e63946;margin-top:2px}
  </style>
</head>
<body>
  <div class="topbar">
    <strong>Add Sub User</strong>
    <a href="{% url 'cxapp_sub_user_list' %}">← Back</a>
  </div>
  <div class="wrap">
    <div class="card">
      <p style="margin-bottom:16px;font-size:13px;color:#6b7c93">{{ slots_remaining }} slot(s) remaining</p>
      <form method="post">
        {% csrf_token %}
        <div class="fg"><label>Username</label>{{ form.username }}
          {% if form.username.errors %}<div class="field-err">{{ form.username.errors|join:", " }}</div>{% endif %}
        </div>
        <div class="fg"><label>Password</label>{{ form.password }}</div>
        <div class="fg"><label>Role</label>{{ form.role }}</div>
        <div class="fg"><label>Mobile</label>{{ form.mobile }}</div>
        <button type="submit" class="btn">Create Sub User</button>
      </form>
    </div>
  </div>
</body>
</html>
