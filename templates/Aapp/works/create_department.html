{% extends 'Aapp/base.html' %}
{% block title %}Create Department{% endblock %}
{% block content %}
<div class="main-content">
<h2>Create Department</h2>
<p><strong>Company:</strong> {{ selected_company.company_name }}</p>

<form method="post">
    {% csrf_token %}
    <table>
        <tr>
            <td><label for="branch">Branch:</label></td>
            <td>
                <select id="branch" name="branch" required>
                    <option value="">Select Branch</option>
                    {% for branch in branches %}
                    <option value="{{ branch.branchid }}">{{ branch.branch_name }}</option>
                    {% endfor %}
                </select>
            </td>
        </tr>
        <tr>
            <td><label for="department_name">Department Name:</label></td>
            <td><input type="text" id="department_name" name="department_name" required></td>
        </tr>
        <tr>
            <td colspan="2">
                <button type="submit" class="button">Create Department</button>
                <a href="{% url 'department_list' %}" class="button">Cancel</a>
            </td>
        </tr>
    </table>
</form></div>
{% endblock %}
