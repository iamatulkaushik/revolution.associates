{% extends 'Aapp/base.html' %}
{% block title %}Add Attendance{% endblock %}
{% block content %}
<div class="main-content">
    {% if messages %}{% for m in messages %}
    <div class="message-alert {% if m.tags == 'success' %}message-success{% else %}message-error{% endif %}">{{ m }}</div>
    {% endfor %}{% endif %}
    <form method="post">
        {% csrf_token %}
        <h2 style="padding:10px;">Add Attendance — {{ company.company_name }}</h2>
        <div class="container_boxed">
            <table>
                <th>
                    <h2>Attendance Details</h2><hr>
                </th>
                <tr><td><label>Employee <span style="color:var(--Color1)">*</span></label>
                </td><td>
                                <select class="large" name="employee_id" id="emp_select" required onchange="fillEmployeeInfo(this)">
                <option value="">-- Select Employee --</option>
                {% for emp in employees %}
                <option value="{{ emp.employeeid }}"
                        data-code="{{ emp.employeecode }}"
                        data-branch="{{ emp.branchID.branch_name|default:'—' }}"
                        data-department="{{ emp.departmentID.department_name|default:'—' }}">
                    {{ emp.name }} ({{ emp.employeecode }})
                </option>
                {% endfor %}
                    </select>
                </td></tr>
                <tr>
                    <td>
                        <input type="text" style="width: 100px;" title="Employee ID" name="emp_code" id="emp_code" readonly>
                    </td>
                    <td>
                        <input type="text" style="width: 200px;" title="Branch Name" id="branch_display" readonly>
                    </td>
                    <td>
                        <input type="text" style="width: 150px;" id="department_display" title="Department Name" readonly>
                    </td>
                    <td>
                        <input type="text" style="width: 100px;" title="Division Name" id="division_display" name="divisionid" placeholder="Division (optional)">
                    </td>
                </tr>
            </table>
            <label>Month <span style="color:var(--Color1)">*</span></label>
            <select class="sml" name="salary_month" required>
                <option value="">--</option>
                {% for val, label in months %}<option value="{{ val }}">{{ label }}</option>{% endfor %}
            </select>
            <label>Year <span style="color:var(--Color1)">*</span></label>
            <select class="sml" name="salary_year" required>
                <option value="">--</option>
                {% for val, label in years %}<option value="{{ val }}">{{ label }}</option>{% endfor %}
            </select><br>
            <label>Working Days</label>
            <input type="number" class="sml" name="working_days" value="0" min="0" step="0.5">
            <label>Holidays</label>
            <input type="number" class="sml" name="holidays" value="0" min="0" step="0.5"><br>
            <label>Casual Leaves</label>
            <input type="number" class="sml" name="casual_leaves" value="0" min="0" step="0.5">
            <label>Earned Leaves</label>
            <input type="number" class="sml" name="earned_leaves" value="0" min="0" step="0.5"><br>
            <label>Sick Leaves</label>
            <input type="number" class="sml" name="sick_leaves" value="0" min="0" step="0.5">
            <label>Comp Leaves</label>
            <input type="number" class="sml" name="comp_leaves" value="0" min="0" step="0.5"><br>
            <label>Work Pay Days</label>
            <input type="number" class="sml" name="work_pay" value="0" min="0" step="0.5"><br>
        </div>
        <div style="margin:15px 10px;">
            <button type="submit" class="button">Save</button>
            <a href="{% url 'list_attendance' %}" class="button" style="margin-left:10px;">Cancel</a>
        </div>
    </form>
</div>
<script>
function fillEmployeeInfo(sel) {
    const opt = sel.options[sel.selectedIndex];
    document.getElementById('emp_code').value = opt.dataset.code || '';
    document.getElementById('branch_display').value = opt.dataset.branch || '';
    document.getElementById('department_display').value = opt.dataset.department || '';
}
</script>
{% endblock %}
