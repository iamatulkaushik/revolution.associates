<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1d3557">
<title>403 — Access denied | Revolution Associates</title>
<link rel="icon" href="/static/favicon.ico">
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1d3557;--mute:#5b6b82;--line:#dbe2ec;--accent:#1d3557;--warn:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#0f1724;--card:#17212f;--ink:#e8eef7;--mute:#9fb0c6;--line:#27364a;--accent:#7fb0ff;--warn:#ff8a7a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
.card{max-width:520px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:36px 32px;text-align:center}
.brand{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 18px}
.code{font-size:72px;font-weight:700;line-height:1;margin:0;color:var(--accent)}
h1{font-size:22px;margin:12px 0 8px}
p{margin:0 0 20px;color:var(--mute)}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
a.btn{display:inline-block;padding:10px 18px;border-radius:8px;border:1px solid var(--accent);color:var(--accent);text-decoration:none;font-weight:600;font-size:15px}
a.btn.primary{background:var(--accent);color:var(--bg)}
small{display:block;margin-top:22px;color:var(--mute);font-size:12px}
</style>
</head>
<body>
<main class="card">
  <p class="brand">Revolution Associates</p>
  <p class="code">403</p>
  <h1>Access denied</h1>
  <p>You do not have permission to open this page or record.</p>
  <div class="actions">
    <a class="btn primary" href="/">Go to home</a>
    <a class="btn" href="javascript:history.back()">Go back</a>
  </div>
  <small>Records belong to the company selected on your account. Switch company or ask your associate for access.</small>
</main>
</body>
</html>
